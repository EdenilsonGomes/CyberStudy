<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3B" />
  <title>Rumevo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0B1F3B;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{max-width:420px;text-align:center}.star{font-size:46px;margin-bottom:14px}.brand{font-size:36px;font-weight:800;letter-spacing:-1px;margin:0}.tag{margin:10px 0 0;color:#E9E7FF;font-size:16px}.msg{margin-top:32px;color:#cbd5e1;line-height:1.5;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="star">✦</div>
    <h1 class="brand">Rumevo</h1>
    <p class="tag">Aprender com direção.</p>
    <p class="msg">Não foi possível abrir o Rumevo agora. Verifique sua conexão com a internet e tente novamente.</p>
  </main>
</body>
</html>
